<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>학습지 · 시험지 디자인 시안 (미리보기)</title>
<style>
@font-face{font-family:PretendardLocal;font-weight:400;src:url(../../fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:PretendardLocal;font-weight:500;src:url(../../fonts/Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:PretendardLocal;font-weight:700;src:url(../../fonts/Pretendard-Bold.woff2) format('woff2')}

:root{--sans:PretendardLocal,Pretendard,'Apple SD Gothic Neo',sans-serif;--serif:'AppleMyungjo','Nanum Myeongjo','Noto Serif KR','Batang',serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:#111827;background:#f4f5f7;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit}
/* ---------- 갤러리 ---------- */
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e7eb}
.top .in{max-width:1320px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}.top p{margin:0;font-size:13px;color:#6b7280;flex:1 1 280px}
.cats{display:flex;gap:6px;flex-wrap:wrap}.cats button,.tg{height:34px;padding:0 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#374151;font-size:13px;cursor:pointer}
.cats button[aria-pressed=true]{background:#111827;border-color:#111827;color:#fff}.tg[aria-pressed=true]{border-color:#111827;color:#111827;font-weight:700}
.grid{max-width:1320px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 22px}
.it{all:unset;cursor:pointer;display:block}.it:focus-visible .th{outline:2px solid #2f7fd0;outline-offset:3px}
.th{position:relative;aspect-ratio:210/297;overflow:hidden;background:#fff;border:1px solid #e5e7eb;border-radius:4px}
.th .stage{position:absolute;left:0;top:0;transform-origin:0 0}
.cap{display:flex;gap:8px;align-items:baseline;margin-top:10px}.cap b{font-size:12px;font-weight:700;color:#6b7280;font-variant-numeric:tabular-nums}.cap span{font-size:14px;font-weight:600}.cap small{margin-left:auto;font-size:12px;color:#9ca3af}
@media(hover:hover) and (pointer:fine){.it:hover .th{border-color:#9ca3af}.cats button:hover,.tg:hover{border-color:#6b7280}}
.view{position:fixed;inset:0;z-index:10;background:#e5e7eb;overflow:auto;display:none}.view.on{display:block}
.vbar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:8px;padding:12px 20px;flex-wrap:wrap}
.vbar b{font-size:15px}.vbar .sp{flex:1}.vbar small{color:#6b7280;font-size:12px}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 12px 60px}.pages .wrap{transform-origin:0 0}
.gray .pg,.gray .th{filter:grayscale(1)}
/* ---------- A4 쪽 (공통) ---------- */
.pg{width:794px;height:1123px;background:#fff;position:relative;padding:var(--mt) var(--ms) 64px;display:flex;flex-direction:column;overflow:hidden;color:#16181d;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.doc{font-size:var(--fs);line-height:var(--lh);font-family:var(--sans)}.doc.f-serif{font-family:var(--serif)}.doc.f-mix .qt,.doc.f-mix .psg,.doc.f-mix .ch{font-family:var(--serif)}
.doc.f-serif header,.doc.f-serif footer{font-family:var(--sans)}
.run{font-size:11px;color:#6b7280;padding-bottom:8px;border-bottom:1px solid #d1d5db;margin-bottom:16px;letter-spacing:.01em}
.cols{flex:1;min-height:0;display:grid;gap:30px}.cols.c2{grid-template-columns:1fr 1fr}.cols.c1{grid-template-columns:1fr}
.cols.rule.c2{background:linear-gradient(#9ca3af,#9ca3af) center/1px 100% no-repeat}.cols.rule.dash.c2{background:repeating-linear-gradient(#9ca3af 0 4px,transparent 4px 8px) center/1px 100% no-repeat}
.col{min-height:0;overflow:hidden}
.blk{margin-bottom:var(--qg);break-inside:avoid}
.stem{display:flex;gap:8px;align-items:baseline}.qt{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}.qt u{text-underline-offset:3px}
.pt{font-size:.9em;white-space:nowrap}.stem>.pt{margin-left:8px}
.n{flex:none;font-family:var(--sans);font-variant-numeric:tabular-nums}
.n-plain{font-weight:700}.n-bold{font-size:1.45em;line-height:1;font-weight:800;color:var(--ac);min-width:1.3em}
.n-circle,.n-square{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;font-size:12px;font-weight:700;color:#fff;background:var(--ac);border-radius:11px;transform:translateY(-1px)}.n-square{border-radius:3px}
.n-pill{font-size:11px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:4px;padding:1px 6px;white-space:nowrap;transform:translateY(-2px)}
.n-two{font-size:1.6em;line-height:1;font-weight:300;color:var(--ac);letter-spacing:-.03em}.n-under{font-weight:800;padding:0 2px 1px;border-bottom:2px solid var(--ac)}
.n-q{font-weight:800;color:var(--ac)}.n-hang{width:40px;font-size:1.3em;font-weight:700;color:#9ca3af}.n-hang+.qt{padding-left:4px}
.n-level{display:grid;font-size:1.35em;line-height:1;font-weight:800;color:var(--ac)}.n-level i{font-style:normal;font-size:7px;letter-spacing:1px;margin-top:3px}
.tl{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,#fff);border-radius:3px;padding:1px 6px;margin-right:6px;transform:translateY(-1px)}
.ch{margin-top:10px;padding-left:22px}.ch span{display:block}.ch i{font-style:normal;margin-right:5px}
.ch-row{display:flex;flex-wrap:wrap;gap:4px 18px}.ch-row span{white-space:nowrap}
.ch-stack span{padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.figw{margin:10px 0 0;text-align:center}.figw.framed{border:1px solid #d1d5db;border-radius:4px;padding:10px}.fig{width:min(240px,100%);color:#16181d;font-family:var(--sans)}
.dt{border-collapse:collapse;margin:0 auto;font-size:.88em;font-family:var(--sans)}.dt th,.dt td{border:1px solid #6b7280;padding:3px 10px;text-align:center}.dt th{font-weight:600;background:#f3f4f6}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 2px}.fr i{font-style:normal}.fr i+i{border-top:1px solid currentColor}
.formula .qt i,.formula .fr{color:var(--ac)}
.bx{position:relative;margin:12px 0 0;padding:14px 14px 10px;border:1px solid #374151}.bx p{margin:2px 0}.bx .bt{position:absolute;top:-.8em;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-size:.88em;letter-spacing:.1em;white-space:nowrap}
.bx-fill{border:0;background:color-mix(in srgb,var(--ac) 7%,#fff);border-radius:6px;padding-top:12px}.bx-fill .bt{position:static;transform:none;display:block;background:none;padding:0 0 4px;color:var(--ac);font-weight:700;font-family:var(--sans)}
.bx-top{border:0;border-top:2px solid var(--ac);border-bottom:1px solid #d1d5db;padding:10px 4px 8px}.bx-top .bt{position:static;transform:none;display:block;padding:0 0 4px;font-weight:700;font-family:var(--sans);color:var(--ac);background:none}
.bx-corner{border:0;padding:14px 16px 10px;background:linear-gradient(var(--ac),var(--ac)) 0 0/18px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) 0 0/2px 18px no-repeat,linear-gradient(var(--ac),var(--ac)) 100% 100%/18px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) 100% 100%/2px 18px no-repeat}.bx-corner .bt{position:static;transform:none;padding:0;background:none;display:block;font-weight:700}
.psg-h{font-weight:700;margin-bottom:8px}
.psg{border:1px solid #374151;padding:12px 14px;margin-bottom:var(--qg)}.psg p{margin:0;text-indent:1em;text-align:justify;word-break:normal}.psg p+p{margin-top:2px}.psg.cut{margin-bottom:0}
.psg-frame{border:0;background:color-mix(in srgb,var(--ac) 6%,#fff);border-radius:6px;padding:14px 16px}
.ox p{display:flex;gap:8px;align-items:baseline;margin:6px 0 0;padding-left:22px}.ox span{flex:1}.ox i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid #9ca3af;border-radius:50%;font-family:var(--sans);font-size:11px;color:#6b7280}
.memo{margin-top:10px}.memo-box{height:120px;border:1px solid #6b7280}.memo-lines{height:84px;background:repeating-linear-gradient(transparent 0 27px,#d1d5db 27px 28px)}
.memo-grid{height:110px;background:linear-gradient(#eef0f3 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,#eef0f3 1px,transparent 1px) 0 0/14px 14px;border:1px solid #e5e7eb}
.memo-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.memo-split div{height:96px;border:1px solid #d1d5db;border-radius:4px;padding:6px 8px}.memo-split em{font-style:normal;font-size:11px;font-weight:700;color:var(--ac);font-family:var(--sans)}
.q-line .q{padding-bottom:var(--qg);border-bottom:1px solid #e5e7eb}.q-dot .q{padding-bottom:var(--qg);border-bottom:1px dotted #9ca3af}
.q-card .q{border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px}
.light{color:#1f2937}
/* 머리말 */
header{margin-bottom:20px;font-family:var(--sans)}
.fld{display:inline-flex;align-items:flex-end;gap:6px;font-size:11.5px;color:#4b5563}.fld em{font-style:normal}.fld i{display:inline-block;height:1px;background:#6b7280;margin-bottom:3px}
.meta{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.h-min{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:12px;border-bottom:2px solid #16181d}.h-min b{display:block;font-size:22px;letter-spacing:-.02em}.h-min span{font-size:12px;color:#6b7280}
.h-hair{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-bottom:10px;border-bottom:1px solid #16181d;font-size:11px;color:#6b7280}.h-hair b{font-size:17px;font-weight:600;color:#16181d}.h-hair>span:last-child{text-align:right}
.h-mono{display:flex;gap:18px;align-items:flex-end;padding:10px 0;border-top:3px solid var(--ac);border-bottom:1px solid var(--ac)}.h-mono b{font-size:18px;margin-right:auto}.h-mono>span{font-size:11.5px;color:#6b7280}
.h-tab{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #d1d5db}.h-tab .tb{background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:4px;max-width:180px}.h-tab b{font-size:19px;margin-right:auto}
.h-pub{display:flex;gap:18px;align-items:center;padding-bottom:14px;border-bottom:1px solid #d1d5db}.h-pub .big{font-size:56px;line-height:.9;font-weight:800;color:var(--ac);letter-spacing:-.04em}.h-pub small{display:block;font-size:11px;font-weight:700;color:var(--ac)}.h-pub b{display:block;font-size:20px;letter-spacing:-.02em}.h-pub>div:nth-child(2){margin-right:auto}.h-pub>div>span{font-size:12px;color:#6b7280}
.h-card{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;background:color-mix(in srgb,var(--ac) 7%,#fff);border-radius:10px}.h-card small{font-size:11px;font-weight:700;color:var(--ac)}.h-card b{display:block;font-size:19px}.h-card .stat{display:flex;gap:6px}.h-card .stat span{min-width:64px;background:#fff;border-radius:6px;padding:6px 10px;font-size:15px;font-weight:700;text-align:center}.h-card .stat em{display:block;font-style:normal;font-size:10px;font-weight:500;color:#6b7280}
.h-check{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ac)}.h-check b{font-size:19px;margin-right:auto}.h-check .cb{display:flex;gap:10px;font-size:11px;color:#4b5563}.h-check .cb i{display:inline-block;width:11px;height:11px;border:1px solid #6b7280;border-radius:2px;margin-right:4px;vertical-align:-1px}
.h-center{text-align:center;padding-bottom:14px;border-bottom:1px double #16181d;border-bottom-width:3px}.h-center small{font-size:11px;letter-spacing:.2em;color:#6b7280}.h-center b{display:block;font-family:var(--serif);font-size:24px;margin:4px 0 10px}.h-center .meta{justify-content:center}
.h-band{margin:calc(var(--mt) * -1) calc(var(--ms) * -1) 22px;padding:calc(var(--mt) - 8px) var(--ms) 16px;background:var(--ac);color:#fff;display:flex;justify-content:space-between;align-items:flex-end}.h-band small{font-size:11px;opacity:.75}.h-band b{display:block;font-size:22px}.h-band .fld{color:#fff}.h-band .fld i{background:#fff}
.h-concept{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:stretch}.h-concept .ttl{border-top:3px solid var(--ac);padding-top:8px}.h-concept small{font-size:11px;color:var(--ac);font-weight:700}.h-concept b{display:block;font-size:19px}.h-concept .sum{background:#f6f7f9;border-radius:6px;padding:10px 14px;font-size:12px}.h-concept .sum b{font-size:12px;color:var(--ac)}.h-concept .sum p{margin:4px 0 0}
.h-goal{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding-bottom:12px;border-bottom:1px solid #d1d5db}.h-goal b{font-size:20px}.h-goal ol{grid-column:1/-1;margin:0;padding:8px 14px 8px 30px;background:color-mix(in srgb,var(--ac) 8%,#fff);border-radius:6px;font-size:12px;display:flex;gap:28px}.h-goal .fld{grid-row:1;grid-column:2;align-self:end}
.h-note{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px;border-bottom:2px solid var(--ac)}.h-note b{font-size:22px;color:var(--ac)}
.h-perf b{display:block;font-size:19px;margin-bottom:10px}.h-perf table,.h-school table,.h-school2 table{width:100%;border-collapse:collapse;font-size:12px}.h-perf th,.h-perf td{border:1px solid #6b7280;padding:7px 8px;height:30px}.h-perf th{background:#f3f4f6;font-weight:600;width:60px}
.h-weekly{display:flex;gap:16px;align-items:center;padding-bottom:12px;border-bottom:1px solid #d1d5db}.h-weekly .wk{font-size:10px;font-weight:700;color:var(--ac);text-align:center;line-height:1.2;border:1.5px solid var(--ac);border-radius:6px;padding:6px 10px}.h-weekly .wk b{font-size:22px}.h-weekly>div:nth-child(2){margin-right:auto}.h-weekly>div>b{display:block;font-size:19px}.h-weekly>div>span{font-size:12px;color:#6b7280}
.h-school{text-align:center}.h-school .l1{font-family:var(--serif);font-size:20px;font-weight:700}.h-school .l2{font-size:14px;margin:4px 0 10px}.h-school th,.h-school td{border:1px solid #16181d;padding:5px 8px}.h-school th{background:#f3f4f6;font-weight:600;width:76px}
.ids{display:flex;justify-content:flex-end;gap:0;margin-top:10px}.ids span{display:flex;border:1px solid #16181d;margin-left:-1px;font-size:12px}.ids em{font-style:normal;padding:5px 8px;background:#f3f4f6;border-right:1px solid #16181d}.ids i{width:72px}.ids i.nb{display:flex;width:auto}.ids i.nb u{width:20px;border-left:1px solid #9ca3af}.ids i.nb u:first-child{border-left:0}
.h-school2 td,.h-school2 th{border:1px solid #16181d;padding:6px;text-align:center}.h-school2 th{background:#f3f4f6;font-weight:600;width:60px}.h-school2 td.t{text-align:left;width:52%}.h-school2 td.t small{display:block;font-size:11px;color:#4b5563}.h-school2 td.t b{font-family:var(--serif);font-size:20px}.h-school2 p{font-size:11.5px;margin:8px 0 0;color:#374151}
.h-schl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-bottom:10px;border-bottom:2px solid #16181d}.h-schl b{font-family:var(--serif);font-size:17px}.h-schl>span{font-size:12px;color:#4b5563;margin-right:auto}.h-schl .ids{margin:0}
.h-sband .bd{background:var(--ac);color:#fff;padding:12px 16px;border-radius:6px;display:flex;justify-content:space-between;align-items:baseline}.h-sband b{font-size:19px}.h-sband span{font-size:12px;opacity:.85}.h-sband .meta{justify-content:flex-end;margin-top:10px}
.h-unit{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--ac);border-bottom:1px solid var(--ac)}.h-unit .tb{color:var(--ac);font-weight:800;font-size:13px}.h-unit b{font-size:16px;margin-right:auto}.h-unit .score{font-size:12px;color:#4b5563;padding-left:40px;border:1px solid #9ca3af;border-radius:4px;padding:4px 8px 4px 42px}
.h-kice .yr{text-align:center;font-size:12.5px;letter-spacing:.02em}.h-kice .row,.h-kcov .row{display:flex;align-items:center;justify-content:center;gap:24px;margin:6px 0 4px}.h-kice .row b{font-family:var(--serif);font-size:30px;letter-spacing:.08em}
.ss{border:1.5px solid #16181d;border-radius:14px;padding:2px 12px;font-size:13px;font-weight:700}.odd{border:1.5px solid #16181d;padding:2px 10px;font-size:13px;font-weight:700}
.h-kice .sub{text-align:center;font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:4px}.h-kice{padding-bottom:10px;border-bottom:3px double #16181d}.h-kice .ids{justify-content:center}
.h-kcov{text-align:center;border:1.5px solid #16181d;padding:22px 26px}.h-kcov .row b{font-family:var(--serif);font-size:34px;letter-spacing:.1em}.h-kcov .yr{font-size:13px;margin-bottom:14px}.h-kcov ul{text-align:left;font-size:12px;line-height:1.7;margin:0 auto;padding:12px 16px 12px 30px;border-top:1px solid #16181d;border-bottom:1px solid #16181d;list-style:'○ ';max-width:560px}.h-kcov .ids{justify-content:center;margin-top:14px}
.h-kline{display:flex;align-items:center;gap:16px;padding-bottom:10px;border-bottom:2px solid #16181d}.h-kline>div{flex:1;text-align:center}.h-kline small{display:block;font-size:11.5px}.h-kline b{font-family:var(--serif);font-size:26px;letter-spacing:.06em}

.h-round{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:3px solid var(--ac)}.h-round>b{font-size:13px;letter-spacing:.24em;color:var(--ac)}.h-round .no{font-size:44px;font-weight:800;line-height:1}.h-round>div{flex:1}.h-round>div b{display:block;font-family:var(--serif);font-size:22px}.h-round>div span{font-size:12px;color:#6b7280}

/* 꼬리말 */
footer{position:absolute;left:var(--ms);right:var(--ms);bottom:22px;font-family:var(--sans);font-size:10.5px;color:#6b7280}
.f-simple{display:flex;justify-content:space-between;border-top:1px solid #e5e7eb;padding-top:8px}.f-simple b{color:#16181d}
.f-brand{display:flex;gap:12px;align-items:center}.f-brand span:first-child{font-weight:800;color:var(--ac)}.f-brand b{margin-left:auto;color:#16181d}
.f-tiny{text-align:center;font-variant-numeric:tabular-nums}

.f-kice{text-align:center}.f-kice b{display:block;font-size:16px;color:#16181d}.f-kice small{font-size:9.5px}
.gray-ac{--ac:#16181d}
@media(max-width:600px){.top .in,.grid{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.cap small{display:none}.vbar{padding:10px 12px}}
/* A4 인쇄: 선택한 시안의 쪽만 */
@page{size:A4;margin:0}
@media print{body{background:#fff}.top,.grid,.vbar{display:none!important}.view{position:static;display:block;background:#fff;overflow:visible}.pages{padding:0;gap:0;display:block}.pages .wrap{transform:none!important;width:auto!important;height:auto!important}.pg{box-shadow:none;break-after:page;width:210mm;height:297mm}}
</style></head><body>
<div class="top"><div class="in"><h1>학습지 · 시험지 디자인 시안</h1><p>미리보기 전용입니다. 승인한 시안만 실제 인쇄에 반영합니다. 예시 문항은 모두 직접 작성한 것입니다.</p><div class="cats" id="cats"></div><button class="tg" id="gray" aria-pressed="false">흑백으로 보기</button></div></div>
<main class="grid" id="grid"></main>
<div class="view" id="view" role="dialog" aria-modal="true" aria-labelledby="vt"><div class="vbar"><button class="tg" id="close">← 목록</button><b id="vt"></b><small id="vs"></small><span class="sp"></span><button class="tg" id="prev">이전</button><button class="tg" id="next">다음</button><button class="tg" id="vgray" aria-pressed="false">흑백</button><button class="tg" id="print">A4 인쇄</button></div><div class="pages" id="pages"></div></div>
<script src="templates.js"></script>
<script>
(()=>{const {T,build,apply}=WT,$=s=>document.querySelector(s);let cat='전체',cur=-1;
const cats=['전체',...new Set(T.map(t=>t.cat))];
$('#cats').innerHTML=cats.map(c=>`<button aria-pressed="${c===cat}" data-c="${c}">${c}${c==='전체'?' '+T.length:''}</button>`).join('');
$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.it').forEach(x=>x.hidden=cat!=='전체'&&x.dataset.c!==cat)};
const grid=$('#grid');
T.forEach((t,i)=>{const a=document.createElement('button');a.className='it';a.dataset.c=t.cat;a.innerHTML=`<div class="th"><div class="stage"><div></div></div></div><div class="cap"><b>${t.id}</b><span>${t.name}</span><small>${t.cat}</small></div>`;a.onclick=()=>open(i);grid.appendChild(a);
 const st=a.querySelector('.stage>div');apply(t,st);build(t,st,{max:1})});
const fit=()=>document.querySelectorAll('.th').forEach(th=>{th.querySelector('.stage').style.transform=`scale(${th.clientWidth/794})`});
const fitView=()=>{const w=$('#pages').clientWidth-24,s=Math.min(1,w/794);document.querySelectorAll('#pages .wrap').forEach(x=>{x.style.transform=`scale(${s})`;x.style.width=794*s+'px';x.style.height=1123*s+'px'})};
function open(i){cur=(i+T.length)%T.length;const t=T[cur];$('#vt').textContent=t.id+' · '+t.name;$('#vs').textContent=t.cat;
 const host=$('#pages');host.innerHTML='';const doc=document.createElement('div');apply(t,doc);doc.style.display='contents';host.appendChild(doc);
 $('#view').classList.add('on');document.body.style.overflow='hidden';build(t,doc,{long:1});
 doc.querySelectorAll('.pg').forEach(pg=>{const w=document.createElement('div');w.className='wrap';pg.replaceWith(w);w.appendChild(pg)});fitView();$('#view').scrollTop=0;history.replaceState(null,'','#'+t.id)}
function close(){$('#view').classList.remove('on');document.body.style.overflow='';history.replaceState(null,'',location.pathname)}
$('#close').onclick=close;$('#prev').onclick=()=>open(cur-1);$('#next').onclick=()=>open(cur+1);$('#print').onclick=()=>print();
const tog=(b,el)=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);el.classList.toggle('gray',on)};
$('#gray').onclick=e=>tog(e.currentTarget,document.body);$('#vgray').onclick=e=>tog(e.currentTarget,$('#view'));
addEventListener('keydown',e=>{if(!$('#view').classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')open(cur+1);if(e.key==='ArrowLeft')open(cur-1)});
addEventListener('resize',()=>{fit();fitView()});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{document.querySelectorAll('.stage>div').forEach((st,i)=>build(T[i],st,{max:1}));fit();const h=location.hash.slice(1),k=T.findIndex(t=>t.id===h);if(k>=0)open(k)});fit();
})();
</script>
</body></html>
