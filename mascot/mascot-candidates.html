<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔비 마스코트 시안</title>
<style>:root{--bg:#f4f8fd;--c:#fff;--t:#1f2933}@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1e232b;--t:#e8ecf2}}
body{margin:0;background:var(--bg);color:var(--t);font-family:Pretendard,system-ui,sans-serif}main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}h1{font-size:24px;margin:0 0 4px}p{margin:0 0 18px;opacity:.7}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}.c{background:var(--c);border-radius:18px;padding:14px;text-align:center;box-shadow:0 1px 6px #0001}.c svg{width:128px;height:128px;display:block;margin:0 auto 8px}.c .s{display:flex;gap:8px;justify-content:center;margin-bottom:6px}.c .s svg{width:40px;height:40px;border-radius:50%;margin:0;overflow:hidden}.c b{display:block;font-size:15px}.c small{opacity:.65;font-size:12px}</style></head><body><main>
<h1>솔비 마스코트 시안 20종</h1><p>번호로 골라 주세요. 작은 동그라미는 프로필(오른쪽 위)에 들어갔을 때 모습이에요. 색·표정·소품은 고른 뒤 얼마든지 바꿀 수 있어요.</p><div class="g" id="g"></div></main>
<script>
const B='#2a72bf',L='#5aa0ec',Y='#ffc21a',D='#14243b',P='#ff9fa8',W='#fff';
const eyes=(x1,x2,y,r=4)=>`<circle cx="${x1}" cy="${y}" r="${r}" fill="${D}"/><circle cx="${x2}" cy="${y}" r="${r}" fill="${D}"/><circle cx="${x1+1.4}" cy="${y-1.4}" r="${r/3}" fill="#fff"/><circle cx="${x2+1.4}" cy="${y-1.4}" r="${r/3}" fill="#fff"/>`;
const smile=(x,y,w=14)=>`<path d="M${x-w/2} ${y}q${w/2} ${w/2} ${w} 0" stroke="${D}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
const cheeks=(x1,x2,y)=>`<circle cx="${x1}" cy="${y}" r="4" fill="${P}" opacity=".75"/><circle cx="${x2}" cy="${y}" r="4" fill="${P}" opacity=".75"/>`;
const drop=(c=B)=>`<path d="M50 12C50 12 22 43 22 62a28 28 0 0 0 56 0C78 43 50 12 50 12z" fill="${c}"/><path d="M50 12C50 12 36 27 29 41c8-6 20-9 31-6C56 25 50 12 50 12z" fill="${L}" opacity=".55"/>`;
const face=(y=63)=>eyes(40,60,y)+cheeks(33,67,y+8)+smile(50,y+8.5);
const bg='<rect width="100" height="100" fill="#eaf3fd"/>';
const M=[
['물방울 기본','가장 단순한 솔비',()=>drop()+face()],
['학사모 물방울','공부하는 물방울',()=>drop()+face(66)+`<path d="M28 34l22-10 22 10-22 10z" fill="${D}"/><path d="M38 40v9q12 6 24 0v-9" fill="${D}"/><path d="M72 34v12" stroke="${Y}" stroke-width="2.5"/><circle cx="72" cy="48" r="3" fill="${Y}"/>`],
['안경 물방울','똑똑해 보이는 안경',()=>drop()+eyes(40,60,64,3)+`<circle cx="40" cy="64" r="8" fill="none" stroke="${D}" stroke-width="2.6"/><circle cx="60" cy="64" r="8" fill="none" stroke="${D}" stroke-width="2.6"/><path d="M48 64h4" stroke="${D}" stroke-width="2.6"/>`+smile(50,76)],
['연필 든 물방울','풀이 중!',()=>drop()+face(60)+`<g transform="rotate(35 78 74)"><rect x="74" y="52" width="8" height="30" rx="1.5" fill="${Y}"/><path d="M74 82h8l-4 9z" fill="#f3d9a8"/><path d="M76.5 87.5h3l-1.5 3.5z" fill="${D}"/><rect x="74" y="49" width="8" height="5" fill="${P}"/></g>`],
['구름 + 빗방울','비 오는 날 구름',()=>`<path d="M28 58a15 15 0 0 1 4-29 20 20 0 0 1 38-2 17 17 0 0 1 2 31z" fill="${L}"/>`+eyes(42,60,46)+smile(51,53,12)+cheeks(36,66,53)+`<path d="M34 70q4 8 0 12a6 6 0 0 1-8-8z M52 74q4 8 0 12a6 6 0 0 1-8-8z M70 70q4 8 0 12a6 6 0 0 1-8-8z" fill="${B}"/>`],
['우산 물방울','우산 쓴 솔비',()=>`<path d="M14 42a36 30 0 0 1 72 0z" fill="${Y}"/><path d="M50 42v32" stroke="${D}" stroke-width="3" stroke-linecap="round"/><path d="M14 42q9 6 18 0 9 6 18 0 9 6 18 0 9 6 18 0" fill="${Y}" stroke="${Y}" stroke-width="2"/><path d="M50 50C50 50 34 66 34 76a16 16 0 0 0 32 0C66 66 50 50 50 50z" fill="${B}"/>`+eyes(44,56,75,2.6)+smile(50,81,8)],
['플라스크 친구','실험실 단짝',()=>`<path d="M40 14h20v6h-3v22l22 38a6 6 0 0 1-5 9H26a6 6 0 0 1-5-9l22-38V20h-3z" fill="#cfe3f8" stroke="${B}" stroke-width="3" stroke-linejoin="round"/><path d="M33 64h34l12 21a3 3 0 0 1-2.6 4.5H23.6A3 3 0 0 1 21 85z" fill="${B}"/>`+eyes(42,58,72,3.4)+smile(50,78,10)+`<circle cx="60" cy="50" r="3" fill="#fff" opacity=".8"/><circle cx="55" cy="40" r="2" fill="#fff" opacity=".8"/>`],
['부엉이 박사','밤새 공부하는 올빼미',()=>`<ellipse cx="50" cy="58" rx="30" ry="32" fill="${B}"/><path d="M26 34l-4-14 16 8M74 34l4-14-16 8" fill="${B}"/><ellipse cx="50" cy="68" rx="18" ry="20" fill="#d9e8f8"/><circle cx="38" cy="50" r="11" fill="#fff"/><circle cx="62" cy="50" r="11" fill="#fff"/><circle cx="38" cy="50" r="5" fill="${D}"/><circle cx="62" cy="50" r="5" fill="${D}"/><path d="M45 58h10l-5 8z" fill="${Y}"/>`],
['파랑 고양이','도도한 솔비냥',()=>`<path d="M22 44L26 18l20 14h8l20-14 4 26z" fill="${B}"/><ellipse cx="50" cy="60" rx="31" ry="28" fill="${B}"/><path d="M28 32l-2-8 10 7zM72 32l2-8-10 7z" fill="${P}" opacity=".7"/>`+eyes(38,62,56,4.5)+`<path d="M47 63h6l-3 4z" fill="${P}"/><path d="M50 67q-5 5-10 2M50 67q5 5 10 2" stroke="${D}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M14 60h16M14 68l15-3M86 60H70M86 68l-15-3" stroke="${D}" stroke-width="1.8" stroke-linecap="round"/>`],
['곰돌이','포근한 곰',()=>`<circle cx="26" cy="30" r="12" fill="${B}"/><circle cx="74" cy="30" r="12" fill="${B}"/><circle cx="26" cy="30" r="6" fill="${L}"/><circle cx="74" cy="30" r="6" fill="${L}"/><circle cx="50" cy="56" r="33" fill="${B}"/><ellipse cx="50" cy="66" rx="14" ry="11" fill="#d9e8f8"/><ellipse cx="50" cy="62" rx="5" ry="3.6" fill="${D}"/>`+eyes(38,62,50,3.6)+`<path d="M50 66v3M44 70q6 5 12 0" stroke="${D}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`+cheeks(30,70,64)],
['꼬마 로봇','AI 튜터 로봇',()=>`<path d="M50 10v10" stroke="${D}" stroke-width="3"/><circle cx="50" cy="9" r="4.5" fill="${Y}"/><rect x="20" y="20" width="60" height="50" rx="16" fill="${B}"/><rect x="28" y="30" width="44" height="28" rx="10" fill="#0f2a4a"/><circle cx="41" cy="44" r="5" fill="#7fe0ff"/><circle cx="59" cy="44" r="5" fill="#7fe0ff"/><path d="M44 52q6 4 12 0" stroke="#7fe0ff" stroke-width="2.6" fill="none" stroke-linecap="round"/><rect x="34" y="72" width="32" height="18" rx="7" fill="${L}"/><rect x="12" y="36" width="8" height="16" rx="4" fill="${Y}"/><rect x="80" y="36" width="8" height="16" rx="4" fill="${Y}"/>`],
['책 친구','펼친 책 캐릭터',()=>`<path d="M50 28q-20-10-38-4v54q18-6 38 4z" fill="#fff" stroke="${B}" stroke-width="3" stroke-linejoin="round"/><path d="M50 28q20-10 38-4v54q-18-6-38 4z" fill="#e8f1fc" stroke="${B}" stroke-width="3" stroke-linejoin="round"/><path d="M50 28v54" stroke="${B}" stroke-width="3"/>`+eyes(36,64,52,3.4)+smile(36,60,0)+`<path d="M30 62q6 6 12 0M58 62q6 6 12 0" stroke="${D}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M44 16l4 8 8-2-5 7" fill="${Y}"/>`],
['별 친구','반짝이는 별',()=>`<path d="M50 10l12 25 27 4-20 19 5 27-24-13-24 13 5-27-20-19 27-4z" fill="${Y}" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/>`+eyes(41,59,50,3.6)+cheeks(34,66,58)+smile(50,57,12)],
['원자 친구','핵 + 전자 궤도',()=>`<ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="${L}" stroke-width="3"/><ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="${L}" stroke-width="3" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="${L}" stroke-width="3" transform="rotate(120 50 50)"/><circle cx="50" cy="50" r="17" fill="${B}"/>`+eyes(44,56,48,2.6)+smile(50,54,8)+`<circle cx="90" cy="50" r="4.5" fill="${Y}"/><circle cx="25" cy="29" r="4.5" fill="${Y}"/><circle cx="25" cy="71" r="4.5" fill="${Y}"/>`],
['토끼','깡충 토끼',()=>`<ellipse cx="36" cy="26" rx="8" ry="20" fill="${B}"/><ellipse cx="64" cy="26" rx="8" ry="20" fill="${B}"/><ellipse cx="36" cy="26" rx="4" ry="14" fill="${P}" opacity=".6"/><ellipse cx="64" cy="26" rx="4" ry="14" fill="${P}" opacity=".6"/><circle cx="50" cy="64" r="28" fill="${B}"/>`+eyes(39,61,60,3.8)+`<path d="M47 67h6l-3 3z" fill="${P}"/>`+smile(50,70,10)+cheeks(31,69,70)],
['펭귄','남극에서 온 펭귄',()=>`<ellipse cx="50" cy="56" rx="32" ry="38" fill="${D}"/><ellipse cx="50" cy="62" rx="22" ry="28" fill="#fff"/>`+eyes(41,59,46,3.4)+`<path d="M44 52h12l-6 8z" fill="${Y}"/><path d="M18 56q-10 12-2 24 8-10 6-22z M82 56q10 12 2 24-8-10-6-22z" fill="${B}"/><ellipse cx="38" cy="92" rx="9" ry="4" fill="${Y}"/><ellipse cx="62" cy="92" rx="9" ry="4" fill="${Y}"/>`],
['연필 친구','연필 캐릭터',()=>`<g transform="rotate(-18 50 50)"><rect x="34" y="14" width="32" height="14" rx="4" fill="${P}"/><rect x="34" y="28" width="32" height="8" fill="#c9d3df"/><rect x="34" y="36" width="32" height="40" fill="${Y}"/><path d="M34 76h32L50 98z" fill="#f3d9a8"/><path d="M44 90h12l-6 9z" fill="${D}"/>${eyes(43,57,52,3)}${smile(50,60,10)}</g>`],
['전구 아이디어','번뜩이는 전구',()=>`<path d="M50 10a28 28 0 0 0-16 51c3 3 4 6 4 10h24c0-4 1-7 4-10A28 28 0 0 0 50 10z" fill="${Y}" stroke="#f0a800" stroke-width="2.5"/><rect x="38" y="74" width="24" height="7" rx="3" fill="#8a93a0"/><rect x="41" y="83" width="18" height="7" rx="3.5" fill="#8a93a0"/>`+eyes(42,58,42,3.4)+cheeks(35,65,50)+smile(50,49,12)+`<path d="M12 28l8 4M88 28l-8 4M8 50h9M92 50h-9" stroke="${Y}" stroke-width="3" stroke-linecap="round"/>`],
['번개 에너지','에너지 번개',()=>`<path d="M58 8L22 56h22l-6 36 40-52H54z" fill="${Y}" stroke="#f0a800" stroke-width="2.5" stroke-linejoin="round"/>`+eyes(46,58,52,3)+smile(52,60,9)],
['물방울 남매','큰 물방울 + 작은 물방울',()=>`<path d="M36 14C36 14 12 42 12 58a24 24 0 0 0 48 0C60 42 36 14 36 14z" fill="${B}"/>`+eyes(28,44,56,3.4)+smile(36,64,11)+cheeks(23,49,63)+`<path d="M72 44C72 44 56 64 56 74a16 16 0 0 0 32 0C88 64 72 44 72 44z" fill="${L}"/>`+eyes(66,78,72,2.6)+smile(72,78,8)]
];
const g=document.getElementById('g');
M.forEach(([n,d,f],i)=>{const svg='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+bg+f()+'</svg>';const c=document.createElement('div');c.className='c';c.innerHTML=svg+'<div class="s">'+svg+'</div><b>'+(i+1)+'. '+n+'</b><small>'+d+'</small>';g.appendChild(c)});
</script></body></html>
