<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔비 마스코트 시안</title>
<style>:root{--bg:#f4f8fd;--c:#fff;--t:#1f2933}@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1e232b;--t:#e8ecf2}}
body{margin:0;background:var(--bg);color:var(--t);font-family:Pretendard,system-ui,sans-serif}main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}h1{font-size:24px;margin:0 0 4px}p{margin:0 0 18px;opacity:.7}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}.c{background:var(--c);border-radius:18px;padding:14px;text-align:center;box-shadow:0 1px 6px #0001}.c svg{width:128px;height:128px;display:block;margin:0 auto 8px}.c .s{display:flex;gap:8px;justify-content:center;margin-bottom:6px}.c .s svg{width:40px;height:40px;border-radius:50%;margin:0;overflow:hidden}.c b{display:block;font-size:15px}.c small{opacity:.65;font-size:12px}</style></head><body><main>
<h1>솔비 마스코트 시안 21종 (고등학생용 · 2차)</h1><p>귀여운 느낌을 빼고 엠블럼·쿨한 캐릭터 위주로 다시 뽑았어요. 번호로 골라 주세요. 작은 동그라미는 프로필(오른쪽 위)에 들어갔을 때 모습이에요. 색·표정·소품은 고른 뒤 얼마든지 바꿀 수 있어요.</p><div class="g" id="g"></div></main>
<script>
const B='#2a72bf',L='#5aa0ec',Y='#ffc21a',D='#14243b',P='#ff9fa8',W='#fff';
const eyes=(x1,x2,y,r=4)=>`<circle cx="${x1}" cy="${y}" r="${r}" fill="${D}"/><circle cx="${x2}" cy="${y}" r="${r}" fill="${D}"/><circle cx="${x1+1.4}" cy="${y-1.4}" r="${r/3}" fill="#fff"/><circle cx="${x2+1.4}" cy="${y-1.4}" r="${r/3}" fill="#fff"/>`;
const smile=(x,y,w=14)=>`<path d="M${x-w/2} ${y}q${w/2} ${w/2} ${w} 0" stroke="${D}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
const cheeks=(x1,x2,y)=>`<circle cx="${x1}" cy="${y}" r="4" fill="${P}" opacity=".75"/><circle cx="${x2}" cy="${y}" r="4" fill="${P}" opacity=".75"/>`;
const drop=(c=B)=>`<path d="M50 12C50 12 22 43 22 62a28 28 0 0 0 56 0C78 43 50 12 50 12z" fill="${c}"/><path d="M50 12C50 12 36 27 29 41c8-6 20-9 31-6C56 25 50 12 50 12z" fill="${L}" opacity=".55"/>`;
const face=(y=63)=>eyes(40,60,y)+cheeks(33,67,y+8)+smile(50,y+8.5);
const bg='<rect width="100" height="100" fill="#eaf3fd"/>';
const eq=(x1,x2,y)=>`<rect x="${x1-3}" y="${y-5}" width="6" height="10" rx="3" fill="${D}"/><rect x="${x2-3}" y="${y-5}" width="6" height="10" rx="3" fill="${D}"/>`;
const flat=(x,y,w=12)=>`<path d="M${x-w/2} ${y}h${w}" stroke="${D}" stroke-width="3" stroke-linecap="round"/>`;
const smirk=(x,y)=>`<path d="M${x-6} ${y}q8 5 14-2" stroke="${D}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
const gdef=`<defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa0ec"/><stop offset="1" stop-color="#1d5ca6"/></linearGradient></defs>`;
const dropG=()=>`<path d="M50 10C50 10 20 44 20 62a30 30 0 0 0 60 0C80 44 50 10 50 10z" fill="url(#gb)"/>`;
const M=[
['S 모노그램','물방울 안의 S — 로고와 가장 닮은 안',()=>gdef+dropG()+`<path d="M58 52c-2-6-14-8-18-2s2 9 10 11 12 5 8 12-18 5-22-2" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>`+`<path d="M30 86q20 7 40 0" stroke="${Y}" stroke-width="5" stroke-linecap="round" fill="none"/>`],
['스우시 물방울','얼굴 없는 엠블럼 + 노란 스우시',()=>gdef+dropG()+`<path d="M24 74l22 10 32-14" stroke="${Y}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
['쿨 물방울','무표정 + 살짝 웃는 입',()=>gdef+dropG()+eq(40,60,60)+smirk(48,74)],
['헤드폰 물방울','공부 BGM 켠 상태',()=>gdef+dropG()+eq(40,60,62)+flat(50,75,10)+`<path d="M24 58a26 26 0 0 1 52 0" stroke="${D}" stroke-width="5" fill="none"/><rect x="16" y="54" width="10" height="20" rx="5" fill="${Y}"/><rect x="74" y="54" width="10" height="20" rx="5" fill="${Y}"/>`],
['후드 물방울','후드티 입은 물방울',()=>gdef+`<path d="M50 14C50 14 22 44 22 62a28 28 0 0 0 56 0C78 44 50 14 50 14z" fill="${D}"/><path d="M50 30C50 30 34 48 34 62a16 16 0 0 0 32 0C66 48 50 30 50 30z" fill="url(#gb)"/>`+eq(44,56,62)+flat(50,72,8)],
['벤젠 엠블럼','화학 느낌의 육각 + 물방울',()=>`<path d="M50 8l36 20v44L50 92 14 72V28z" fill="none" stroke="${B}" stroke-width="5" stroke-linejoin="round"/><path d="M50 26C50 26 34 46 34 58a16 16 0 0 0 32 0C66 46 50 26 50 26z" fill="${B}"/><circle cx="50" cy="12" r="5" fill="${Y}"/>`],
['궤도 물방울','원자 궤도를 도는 방울',()=>gdef+`<ellipse cx="50" cy="56" rx="42" ry="14" fill="none" stroke="${L}" stroke-width="3" transform="rotate(-24 50 56)"/>`+`<path d="M50 20C50 20 32 42 32 56a18 18 0 0 0 36 0C68 42 50 20 50 20z" fill="url(#gb)"/><circle cx="84" cy="40" r="5" fill="${Y}"/>`],
['라인 물방울','가는 선 아이콘',()=>`<path d="M50 12C50 12 22 44 22 62a28 28 0 0 0 56 0C78 44 50 12 50 12z" fill="none" stroke="${B}" stroke-width="5" stroke-linejoin="round"/><path d="M36 64a14 14 0 0 0 10 14" stroke="${Y}" stroke-width="5" stroke-linecap="round" fill="none"/>`],
['달밤 공부','달 + 별, 야자 분위기',()=>`<rect width="100" height="100" fill="#14243b"/><path d="M62 16a34 34 0 1 0 22 56A28 28 0 0 1 62 16z" fill="${Y}"/><path d="M74 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/><circle cx="24" cy="24" r="2" fill="#fff"/><circle cx="84" cy="52" r="1.6" fill="#fff"/><circle cx="18" cy="60" r="1.6" fill="#fff"/>`],
['선글라스 스티커','굵은 외곽선 스티커풍',()=>`<path d="M50 12C50 12 20 44 20 62a30 30 0 0 0 60 0C80 44 50 12 50 12z" fill="${B}" stroke="${D}" stroke-width="5" stroke-linejoin="round"/><path d="M28 56h44l-4 12a6 6 0 0 1-6 4H40a6 6 0 0 1-6-4z" fill="${D}"/><path d="M42 80q8 5 16 0" stroke="${D}" stroke-width="4" stroke-linecap="round" fill="none"/>`],
['폴리 여우','기하학 도형 여우',()=>`<path d="M14 18l22 14h28l22-14-6 40-30 32-30-32z" fill="${B}"/><path d="M36 32l14 20 14-20z" fill="${L}"/><path d="M50 52l-12 20 12 18 12-18z" fill="#d9e8f8"/><path d="M14 18l22 14-12 22zM86 18L64 32l12 22z" fill="${D}" opacity=".25"/>`+`<circle cx="38" cy="50" r="3" fill="${D}"/><circle cx="62" cy="50" r="3" fill="${D}"/><path d="M46 84h8l-4 6z" fill="${D}"/>`],
['폴리 늑대','기하학 늑대 — 시크',()=>`<path d="M16 14l20 22h28l20-22 4 40-24 36H36L12 54z" fill="${D}"/><path d="M36 36h28l-6 24H42z" fill="${B}"/><path d="M42 60h16l-8 22z" fill="#d9e8f8"/><path d="M38 46l8 3M62 46l-8 3" stroke="${Y}" stroke-width="4" stroke-linecap="round"/>`],
['올빼미 플랫','면과 선만 쓴 올빼미',()=>`<path d="M20 20l16 10h28l16-10v44a30 30 0 0 1-60 0z" fill="${B}"/><circle cx="38" cy="48" r="11" fill="#fff"/><circle cx="62" cy="48" r="11" fill="#fff"/><circle cx="38" cy="48" r="4.5" fill="${D}"/><circle cx="62" cy="48" r="4.5" fill="${D}"/><path d="M46 58h8l-4 8z" fill="${Y}"/><path d="M34 76q16 8 32 0" stroke="${L}" stroke-width="4" fill="none" stroke-linecap="round"/>`],
['고양이 실루엣','안경 낀 검정+파랑 고양이',()=>`<path d="M20 44L22 14l20 14h16l20-14 2 30c4 20-8 40-30 40S16 64 20 44z" fill="${D}"/><circle cx="38" cy="54" r="10" fill="none" stroke="${B}" stroke-width="3.5"/><circle cx="62" cy="54" r="10" fill="none" stroke="${B}" stroke-width="3.5"/><path d="M48 54h4" stroke="${B}" stroke-width="3.5"/><circle cx="38" cy="54" r="3" fill="${Y}"/><circle cx="62" cy="54" r="3" fill="${Y}"/>`],
['바이저 로봇','시야 바이저만 있는 미니멀 로봇',()=>`<rect x="18" y="22" width="64" height="56" rx="22" fill="${B}"/><rect x="28" y="38" width="44" height="22" rx="11" fill="${D}"/><circle cx="40" cy="49" r="4" fill="#7fe0ff"/><circle cx="60" cy="49" r="4" fill="#7fe0ff"/><rect x="42" y="12" width="16" height="8" rx="4" fill="${Y}"/>`],
['에너지 물방울','번개가 들어간 물방울',()=>gdef+dropG()+`<path d="M54 42L38 66h12l-4 16 18-26H52z" fill="${Y}"/>`],
['플라스크 라인','가는 선 플라스크',()=>`<path d="M40 12h20M44 12v24L22 76a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L56 36V12" fill="none" stroke="${B}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 66h36l7 12a3 3 0 0 1-2.6 4.5H27.6A3 3 0 0 1 25 78z" fill="${Y}"/>`],
['물결 파동','물방울이 만든 파동',()=>`<circle cx="50" cy="50" r="12" fill="${B}"/><circle cx="50" cy="50" r="26" fill="none" stroke="${B}" stroke-width="4" opacity=".65"/><circle cx="50" cy="50" r="40" fill="none" stroke="${B}" stroke-width="3" opacity=".35"/><circle cx="50" cy="50" r="4" fill="${Y}"/>`],
['샤프 + 방울','샤프펜슬과 물방울',()=>gdef+`<path d="M40 16C40 16 20 40 20 54a20 20 0 0 0 40 0C60 40 40 16 40 16z" fill="url(#gb)"/><g transform="rotate(38 72 64)"><rect x="66" y="30" width="12" height="42" rx="3" fill="${Y}"/><path d="M66 72h12l-6 14z" fill="#d9e8f8"/><rect x="66" y="26" width="12" height="6" rx="2" fill="${D}"/></g>`],
['빗방울 3단','추상 마크 — 세 방울',()=>`<path d="M50 8C50 8 36 26 36 36a14 14 0 0 0 28 0C64 26 50 8 50 8z" fill="${B}"/><path d="M28 50C28 50 14 68 14 78a14 14 0 0 0 28 0C42 68 28 50 28 50z" fill="${L}"/><path d="M72 50C72 50 58 68 58 78a14 14 0 0 0 28 0C86 68 72 50 72 50z" fill="${Y}"/>`],
['이니셜 배지','원형 배지 + S + 스우시',()=>`<circle cx="50" cy="50" r="42" fill="${B}"/><path d="M60 38c-2-8-20-10-24-2s4 11 14 13 16 6 11 15-24 7-28-2" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M22 80q28 10 56 0" stroke="${Y}" stroke-width="6" stroke-linecap="round" fill="none"/>`]
];
const g=document.getElementById('g');
M.forEach(([n,d,f],i)=>{const svg='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+bg+f()+'</svg>';const c=document.createElement('div');c.className='c';c.innerHTML=svg+'<div class="s">'+svg+'</div><b>'+(i+1)+'. '+n+'</b><small>'+d+'</small>';g.appendChild(c)});
</script></body></html>
