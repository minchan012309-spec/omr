<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시리즈 표지 만들기 · Solvi 솔비</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Paperozi;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Paperozi;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Paperozi;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Paperozi;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:Paperozi;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:PretendardLocal;font-weight:400;src:url(fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:PretendardLocal;font-weight:700;src:url(fonts/Pretendard-Bold.woff2) format('woff2')}
:root{--bg:#f2f4f6;--sf:#fff;--t:#191f28;--m:#6b7684;--l:#e5e8eb;--b:#2a72bf;--f:Pretendard,PretendardLocal,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#101012;--sf:#1b1b1e;--t:#f2f4f6;--m:#9aa3ad;--l:#2c2c30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:100vh}
.ctl{background:var(--sf);border-right:1px solid var(--l);padding:20px 18px 40px;overflow:auto;max-height:100vh;position:sticky;top:0}
.ctl h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}.ctl .sub{margin:0 0 16px;color:var(--m);font-size:13px}
.ctl h2{font-size:13px;margin:20px 0 8px;color:var(--m);font-weight:600;letter-spacing:.02em}
.fld{margin-bottom:10px}.fld label{display:block;font-size:12.5px;color:var(--m);margin-bottom:4px}
.fld input[type=text],.fld select,.fld textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:0;border-radius:12px;background:var(--bg);color:var(--t)}
.fld textarea{resize:vertical;min-height:84px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1px var(--l);cursor:pointer;padding:0}.sw button.on{box-shadow:0 0 0 2px var(--t)}
.sw input[type=color]{width:32px;height:32px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:8px 4px;border-radius:10px;color:var(--m);cursor:pointer}.seg button.on{background:var(--sf);color:var(--t);font-weight:600;box-shadow:0 1px 3px #0001}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--b);color:#fff;font:inherit;font-weight:700;padding:14px;cursor:pointer;margin-top:14px}.btn.s{background:var(--bg);color:var(--t);font-weight:600;margin-top:8px}
.hint{font-size:12.5px;color:var(--m);margin:6px 0 0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.view{padding:24px;overflow:auto}.sheets{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.sheet{position:relative;flex:none;box-shadow:0 8px 30px #0003;border-radius:2px;overflow:hidden;background:#fff}
.cap{font-size:12px;color:var(--m);margin:0 0 6px}
.pg{display:block}
/* ---- 표지 (A4 210×297mm 기준, 다른 용지는 zoom으로 비례 확대·축소) ---- */
.cv{position:absolute;left:0;top:0;width:210mm;height:297mm;overflow:hidden;color:#f4f6f3;background:radial-gradient(120% 90% at 85% 55%,var(--c3) 0%,rgba(0,0,0,0) 60%),linear-gradient(160deg,var(--c1) 0%,var(--c2) 100%);font-family:Paperozi,Pretendard,PretendardLocal,'Noto Sans KR',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,rgba(255,255,255,0) 2px 7px);pointer-events:none}
.cv .wm{position:absolute;left:72mm;top:46mm;font-size:250mm;font-weight:900;line-height:1;color:rgba(255,255,255,.07)}
.cv .tl{position:absolute;top:26mm;left:24mm}.cv .sr{font-size:4.2mm;font-weight:800;letter-spacing:.34em}.cv .bk{margin-top:1.6mm;font-size:3.4mm;font-weight:400;opacity:.8}
.cv .tb{position:absolute;left:24mm;top:90mm;right:20mm}.cv .sm{position:relative;display:inline-block;font-size:11mm;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.55);line-height:1}.cv .sm::after{content:'';position:absolute;left:-1mm;right:-1mm;top:52%;height:.9mm;background:var(--acc)}
.cv .bg{margin-top:6mm;font-size:27mm;font-weight:800;line-height:1.02;letter-spacing:-.035em;color:#f4f6f3}.cv .ru{margin-top:14mm;width:30mm;height:2.4mm;background:var(--acc)}.cv .ko{margin-top:6mm;font-size:8.4mm;font-weight:800;letter-spacing:-.01em}.cv .bn{margin-top:3mm;font-size:4.2mm;font-weight:500;opacity:.75}
.cv .volno{position:absolute;right:20mm;top:26mm;text-align:right}.cv .volno b{display:block;font-size:30mm;font-weight:900;line-height:1;color:var(--acc);letter-spacing:-.04em}.cv .volno span{display:block;margin-top:1mm;font-size:4mm;letter-spacing:.3em;opacity:.7}
.cv .sb{position:absolute;left:24mm;bottom:23mm}.cv .sl{font-size:4.4mm;font-weight:500;letter-spacing:.22em;color:rgba(255,255,255,.6)}.cv .sn{margin-top:1mm;font-size:13mm;font-weight:800;letter-spacing:-.02em;line-height:1.1}.cv .gr{display:inline-block;margin-top:3mm;padding:1.6mm 6mm;background:var(--acc);color:var(--on);border-radius:2.5mm;font-size:6.2mm;font-weight:700}
.cv.bkn{background:radial-gradient(120% 90% at 15% 55%,var(--c3) 0%,rgba(0,0,0,0) 60%),linear-gradient(160deg,var(--c1) 0%,var(--c2) 100%)}.cv.bkn .wm{left:auto;right:60mm}
.cv .ct2{position:absolute;left:0;right:0;top:112mm;text-align:center}.cv .ct2 .ru{margin:0 auto 10mm}.cv .ct2 .bg{margin-top:0;font-size:16.2mm}.cv .ct2 .ko{margin-top:8mm;font-size:6mm;font-weight:500;opacity:.9}
.cv .cvlogo{position:absolute;bottom:24mm;height:10mm;display:flex;align-items:center}.cv .cvlogo.R{right:24mm}.cv .cvlogo.L{left:24mm}.cv .cvlogo.C{left:0;right:0;justify-content:center}
.cv .lg{height:10mm;width:auto;max-width:46mm;object-fit:contain;display:block}.cv .lg path:first-child{fill:#f4f6f3}.cv img.lg.wh{filter:brightness(0) invert(1)}
.cv .cvlg{position:absolute;left:0;right:0;display:flex;justify-content:center}.cv .cvlg.bc{bottom:48mm}.cv .cvlg.tc{top:44mm}.cv .cvlg .lg{height:14mm;max-width:64mm}
.cv .bt2{position:absolute;left:24mm;right:24mm;bottom:23mm;display:flex;justify-content:space-between;align-items:flex-end}.cv .bt2 .sr{font-size:3.8mm}.cv .sc2{text-align:right;font-size:5mm;font-weight:700}.cv .sc2 span{display:inline-block;margin-left:2mm;padding:.8mm 3.6mm;background:var(--acc);color:var(--on);border-radius:2mm;font-size:4.4mm}
.cv .lgtx{font-weight:800;font-size:5mm;color:#fff;white-space:nowrap}
@media(max-width:900px){.app{grid-template-columns:1fr}.ctl{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--l)}}
@media print{
 body{background:#fff}.app{display:block}.ctl,.cap{display:none!important}.view{padding:0;overflow:visible}.sheets{display:block}
 .sheet{zoom:1!important;box-shadow:none;border-radius:0;margin:0}
 .sheets>div{break-after:page;page-break-after:always}.sheets>div:last-child{break-after:auto;page-break-after:auto}
}
</style>
<style id="pgsz">@page{size:210mm 297mm;margin:0}</style>
</head>
<body>
<div class="app">
<aside class="ctl">
 <h1>시리즈 표지 만들기</h1>
 <p class="sub">같은 디자인으로 권마다 이름만 바꿔 표지를 한 번에 만들어요. 인쇄(PDF 저장)하면 앞·뒤 표지가 한 쪽씩 나와요.</p>

 <h2>과목 · 문구</h2>
 <div class="fld"><label>과목 불러오기</label><select id="pre"></select></div>
 <div class="fld"><label>영문 제목 <span style="opacity:.7">(&amp; 앞에서 줄이 바뀌어요)</span></label><input type="text" id="en" maxlength="28"></div>
 <div class="row2">
  <div class="fld"><label>작은 영문</label><input type="text" id="small" maxlength="16"></div>
  <div class="fld"><label>큰 배경 글자</label><input type="text" id="wm" maxlength="1"></div>
 </div>
 <div class="fld"><label>시리즈 문구</label><input type="text" id="ser" maxlength="24"></div>
 <div class="fld"><label>과목 이름</label><input type="text" id="ko" maxlength="20"></div>

 <h2>권 구성</h2>
 <div class="fld"><label>권 목록 <span style="opacity:.7">(한 줄에 한 권 · 이름 | 부제)</span></label>
  <textarea id="vols" placeholder="유형서 1권 | 개념과 기본 유형&#10;유형서 2권 | 실전 유형&#10;모의고사"></textarea></div>
 <label class="chk"><input type="checkbox" id="num"> 권 번호를 크게 표시 (01, 02 …)</label>
 <div class="row2">
  <div class="fld"><label>학교</label><input type="text" id="school" maxlength="14" placeholder="예: 해원고"></div>
  <div class="fld"><label>학년</label><input type="text" id="grade" maxlength="10" placeholder="예: 2학년"></div>
 </div>

 <h2>색 · 로고</h2>
 <div class="sw" id="sw"></div>
 <div class="fld" style="margin-top:12px"><label>로고</label>
  <div class="seg" id="lgsel"><button data-v="solvi">솔비</button><button data-v="up">내 로고</button><button data-v="none">없음</button></div></div>
 <div id="uprow" style="display:none"><div class="fld"><input type="file" id="lgf" accept="image/*"></div><label class="chk"><input type="checkbox" id="lgw" checked> 로고를 흰색으로 바꾸기 (어두운 표지에서 잘 보여요)</label></div>
 <div class="fld"><label>앞표지 로고 위치</label><div class="seg" id="lfp"><button data-v="L">왼쪽</button><button data-v="C">가운데</button><button data-v="R">오른쪽</button></div></div>
 <div class="fld"><label>뒷표지 로고 위치</label><div class="seg" id="lbp"><button data-v="bc">아래</button><button data-v="tc">위</button></div></div>

 <h2>출력</h2>
 <div class="fld"><label>용지</label><select id="size"><option value="210,297">A4 (210×297)</option><option value="176,250">B5 (176×250)</option><option value="148,210">A5 (148×210)</option><option value="188,257">4×6배판 (188×257)</option></select></div>
 <div class="fld"><label>만들 표지</label><div class="seg" id="which"><button data-v="both">앞 + 뒤</button><button data-v="front">앞만</button><button data-v="back">뒤만</button></div></div>
 <button class="btn" onclick="window.print()">인쇄 · PDF로 저장</button>
 <button class="btn s" onclick="resetAll()">처음 값으로</button>
 <p class="hint">인쇄 창에서 「배경 그래픽」을 켜고, 여백은 「없음」으로 두면 색이 끝까지 채워져요. 입력한 내용은 이 기기에 자동 저장돼요.</p>
</aside>
<main class="view"><div class="sheets" id="sheets"></div></main>
</div>
