@media(max-width:720px){#helpBtn{order:5;min-width:44px;min-height:44px}}
#tourmenu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--l);border-radius:12px;box-shadow:0 8px 24px #0002;padding:6px;width:min(300px,calc(100vw - 16px))}
#tourmenu .tmh{padding:8px 10px;font-size:12.5px;color:var(--m);font-weight:700}
#tourmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:8px;font:inherit;cursor:pointer;min-height:44px}
#tourmenu button:hover{background:var(--bl)}#tourmenu button span{font-size:12.5px;color:var(--m)}#tourmenu button i{font-style:normal;color:var(--b)}

<style>
.pkl{display:flex;flex-direction:column;gap:6px}.pki{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--l);border-radius:10px;padding:8px 10px}.pki small{display:block;color:var(--m);font-size:12px}
</style>
<style>
/* 알림 */
#bellBtn{position:relative;width:38px;height:38px;border-radius:50%;cursor:pointer;padding:0;flex:none;display:grid;place-items:center;background:#ffffff1f;border:1px solid #ffffff55;color:#fff}#bellBtn:hover{background:#ffffff33}
#bellN{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}#bellN[hidden]{display:none}
@media(max-width:720px){#bellBtn{order:5;min-width:44px;min-height:44px}#helpBtn{order:5}}
#notifp{position:fixed;right:8px;z-index:70;width:min(400px,calc(100vw - 16px));max-height:min(78vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--l);border-radius:14px;box-shadow:0 12px 34px #0003;padding:12px}
#notifp .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#notifp .ncomp{border:1px solid var(--l);border-radius:10px;padding:8px 10px;margin-bottom:10px}#notifp .ncomp summary{cursor:pointer;font-weight:700;min-height:32px}
#notifp .ncf{display:flex;flex-direction:column;gap:6px;margin-top:8px}#notifp .ncf textarea{font:inherit;padding:8px 10px;border:1px solid var(--l2);border-radius:8px;resize:vertical}

#notifp .ni{border-top:1px solid var(--l);padding:10px 2px}#notifp .ni.new{background:var(--bl);border-radius:8px;padding:10px 8px;margin:2px 0}
#notifp .nt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}#notifp .nt small{margin-left:auto;color:var(--m);font-size:12px}#notifp .ni p{margin:4px 0 6px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
#notifp .ntag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--bl);color:var(--bd)}#notifp .ntag.n{background:#fff2e3;color:#8a4b00}
</style>
<style>
#cfgBox{position:relative}#cfgBox .cfgx{position:sticky;top:0;float:right;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--l);background:var(--surface);font-size:16px;cursor:pointer;margin:-6px -6px 0 8px;box-shadow:0 2px 8px #0002}

#notifp .ni.go{cursor:pointer}#notifp .ni.go:hover{background:var(--bl);border-radius:8px}#notifp .ngo{font-size:12.5px;color:var(--bd);font-weight:700}
</style>

  const det=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null;if(!det)await loadJsQR();
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(!_scanOn)return;let txt='';try{if(det){const r=await det.detect(v);if(r[0])txt=r[0].rawValue}else if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const d=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(d.data,d.width,d.height);if(r)txt=r.data}}catch(e){}
   if(txt){const bm=txt.match(/#bk=((?:me|cm)-(?:c|t|x[0-9a-z.\-]+)(?:~g[1-3])?:(?:\d+|all))/);if(bm){stopScan();bkRoute(bm[1]);return}const m=txt.match(/#ws=([A-Za-z0-9-]+)/)||txt.match(/^([A-Za-z0-9-]{6,})$/);if(m){stopScan();openByNumber(m[1]);return}}
   requestAnimationFrame(tick)};tick()}
 catch(e){$('#scanMsg').textContent='카메라를 사용할 수 없습니다. 번호를 직접 입력하세요. ('+(e.message||e)+')'}}

 const rows=Object.fromEntries(typeRows().map(o=>[o.k,o]));const wmap={skull:4,red:3,yellow:2,gray:2,green:1,star:.5};
 const ws=keys.map(k=>W.dist==='weak'?(wmap[(rows[k]||{}).lv]||1):1);const sum=ws.reduce((a,b)=>a+b,0)||1;
 const out=keys.map((k,i)=>Math.floor(total*ws[i]/sum));let rem=total-out.reduce((a,b)=>a+b,0);
 const ord=keys.map((k,i)=>[i,(total*ws[i]/sum)-out[i]]).sort((a,b)=>b[1]-a[1]);let j=0;while(rem>0&&ord.length){out[ord[j%ord.length][0]]++;rem--;j++}

function pkWhyNot(){if(!window.isSecureContext)return '지금 보안 연결(https)이 아닌 주소로 열려 있어서 패스키를 쓸 수 없어요. 주소가 <b>https://'+location.host+'</b> 로 시작하는지 확인하세요.';
 if(/KAKAOTALK|NAVER\(|FBAN|FBAV|Instagram|; wv\)|Line\//i.test(navigator.userAgent))return '카카오톡·네이버 같은 앱 안에서 연 화면(앱 내 브라우저)은 패스키를 지원하지 않아요. 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러 Chrome·삼성 인터넷·Safari에서 열어 주세요.';
 if(!window.PublicKeyCredential)return '이 브라우저는 패스키를 지원하지 않아요. 최신 <b>Chrome·삼성 인터넷·Safari</b>에서 열어 주세요.';
 return '패스키를 쓸 수 없는 상태예요. 온라인 저장 연결을 확인하세요.'}
const pkOK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&cloud());
const b64u2buf=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const buf2b64u=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function pkCall(body){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),25000);let r;
 try{r=await fetch(base_()+'/functions/v1/passkey',{method:'POST',headers:hdr(),body:JSON.stringify(body),signal:ac.signal})}
 catch(e){if(e.name==='AbortError')throw new Error('패스키 서버가 응답하지 않아요 (25초). 함수가 배포됐는지, Verify JWT가 꺼져 있는지 확인하세요.');
  let reach=false;try{await fetch(base_()+'/functions/v1/passkey',{method:'GET',mode:'no-cors'});reach=true}catch(x){}
  throw new Error(reach?'서버는 응답하는데 브라우저가 막았어요(CORS). ① 함수 설정에서 「Verify JWT」를 끄고 ② 비밀값 SITE_URL이 지금 주소('+location.origin+')와 같은지(또는 비워 두었는지) 확인한 뒤 함수를 다시 Deploy 하세요.':'패스키 서버에 아예 연결하지 못했어요. 인터넷 연결과, 함수 이름이 passkey인지, 배포됐는지 확인하세요.')}finally{clearTimeout(tm)}
 const raw=await r.text();let j={};try{j=JSON.parse(raw)}catch(e){}
 if(!r.ok)throw new Error(r.status===404?'패스키 서버가 아직 설정되지 않았어요. (함수 이름 passkey 확인)':r.status===401&&!j.error?'서버가 요청을 거부했어요 (401). 함수 설정에서 Verify JWT를 꺼 주세요.':('['+r.status+'] '+(j.error||raw.slice(0,120)||'패스키 요청에 실패했어요')));return j}
async function pkCreate(o){o.challenge=b64u2buf(o.challenge);o.user.id=b64u2buf(o.user.id);(o.excludeCredentials||[]).forEach(c=>c.id=b64u2buf(c.id));
 const c=await navigator.credentials.create({publicKey:o});return {id:c.id,rawId:buf2b64u(c.rawId),type:c.type,response:{clientDataJSON:buf2b64u(c.response.clientDataJSON),attestationObject:buf2b64u(c.response.attestationObject),transports:c.response.getTransports?c.response.getTransports():[]},clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},authenticatorAttachment:c.authenticatorAttachment}}
async function pkGet(o){o.challenge=b64u2buf(o.challenge);(o.allowCredentials||[]).forEach(c=>c.id=b64u2buf(c.id));
 const c=await navigator.credentials.get({publicKey:o});const r=c.response;return {id:c.id,rawId:buf2b64u(c.rawId),type:c.type,response:{clientDataJSON:buf2b64u(r.clientDataJSON),authenticatorData:buf2b64u(r.authenticatorData),signature:buf2b64u(r.signature),userHandle:r.userHandle?buf2b64u(r.userHandle):undefined},clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},authenticatorAttachment:c.authenticatorAttachment}}
const pkWho=()=>STUD&&!STUD.preview?{who:'student',login:STUD.login,secret:STUD.pw}:{who:'teacher'};
function pkErr(e){try{console.warn('passkey',e)}catch(x){}if(e&&e.name==='SecurityError')return '이 주소에서는 패스키를 쓸 수 없어요 (보안 오류). 인증서가 정상인 https 주소인지, 서버의 SITE_URL이 이 주소와 같은지 확인하세요.';if(e&&(e.name==='NotAllowedError'||e.name==='AbortError'))return '패스키 창이 닫혔거나 시간이 지났어요. 기기에 화면 잠금(지문·얼굴·PIN)이 설정돼 있는지 확인하고, 뜨는 창에서 승인해 주세요.';if(e&&e.name==='InvalidStateError')return '이 기기에는 이미 등록된 패스키예요';return (e&&e.message)||'패스키에 실패했어요'}
async function pkRegister(){try{const a=pkWho();const {options,cid}=await pkCall({action:'reg-options',...a});const cred=await pkCreate(options);
  const ua=navigator.userAgent;const label=/iPad/.test(ua)?'iPad':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'내 기기';
  await pkCall({action:'reg-verify',cid,credential:cred,label,...a});toast('패스키를 등록했어요');pkRefresh()}catch(e){toast(pkErr(e))}}

  if(r.kind==='teacher'){const x=await fetch(base_()+'/auth/v1/verify',{method:'POST',headers:{apikey:CF.key,'Content-Type':'application/json'},body:JSON.stringify({type:'magiclink',token_hash:r.token_hash})});const j=await x.json();

async function pkRefresh(){const el=document.getElementById('pkbox');if(!el)return;if(!pkOK()){el.innerHTML='<div class="m">'+pkWhyNot()+'</div>';return}

  el.innerHTML=`${it.length?`<div class="pkl">${it.map(p=>`<div class="pki"><span><b>${esc(p.label||'패스키')}</b><small>${new Date(p.created_at).toLocaleDateString('ko-KR')} 등록</small></span><button class="s sm" onclick="pkRemove(${p.id})">삭제</button></div>`).join('')}</div>`:'<div class="m">등록된 패스키가 없어요.</div>'}<div class="row" style="margin-top:8px"><button class="p" onclick="pkRegister()">이 기기에 패스키 등록</button></div>`}
 catch(e){el.innerHTML=`<div class="m" style="color:var(--no)">${esc(e.message)}</div><div class="row" style="margin-top:8px"><button class="s sm" onclick="pkRefresh()">다시 시도</button><button class="s sm" onclick="pkPing()">서버 점검</button></div>`}}

function omrSolve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
 const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x}
function omrHomography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-x*u,-y*u]);b.push(u);A.push([0,0,0,x,y,1,-x*v,-y*v]);b.push(v)}const h=omrSolve(A,b);return [...h,1]}
const omrMap=(H,x,y)=>{const d=H[6]*x+H[7]*y+1;return [(H[0]*x+H[1]*y+H[2])/d,(H[3]*x+H[4]*y+H[5])/d]};
async function omrLoadImg(file){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
 const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bmp,0,0,w,h);return {cv,cx,w,h}}
function omrBinary(cx,w,h){const d=cx.getImageData(0,0,w,h).data,n=w*h,g=new Float32Array(n);for(let i=0;i<n;i++)g[i]=d[i*4]/* 빨간 인쇄(틀·번호)는 빨간 채널에서 밝게 보여 사라지고, 연필·사인펜 자국과 검은 모서리 표시만 남습니다 */;
 const W1=w+1,I=new Float64Array(W1*(h+1));for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=g[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+row}}
 const R=Math.max(14,Math.round(Math.min(w,h)/20)),bin=new Uint8Array(n);
 for(let y=0;y<h;y++){const y0=Math.max(0,y-R),y1=Math.min(h,y+R+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-R),x1=Math.min(w,x+R+1);const s=I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0];const mean=s/((y1-y0)*(x1-x0));bin[y*w+x]=g[y*w+x]<mean*.8&&g[y*w+x]<175?1:0}}
 return bin}
function omrMarkers(bin,w,h){const lab=new Int32Array(w*h),comps=[];let id=0;const st=[];
 for(let s=0;s<w*h;s++){if(!bin[s]||lab[s])continue;id++;let a=0,sx=0,sy=0,x0=w,x1=0,y0=h,y1=0;st.push(s);lab[s]=id;
  while(st.length){const p=st.pop(),x=p%w,y=(p-x)/w;a++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&bin[p-1]&&!lab[p-1]){lab[p-1]=id;st.push(p-1)}if(x<w-1&&bin[p+1]&&!lab[p+1]){lab[p+1]=id;st.push(p+1)}if(y>0&&bin[p-w]&&!lab[p-w]){lab[p-w]=id;st.push(p-w)}if(y<h-1&&bin[p+w]&&!lab[p+w]){lab[p+w]=id;st.push(p+w)}}
  const bw=x1-x0+1,bh=y1-y0+1;if(a<120||bw<8||bh<8||bw>.14*Math.max(w,h)||bh>.14*Math.max(w,h))continue;const asp=bw/bh,fill=a/(bw*bh);if(asp<.55||asp>1.6||fill<.66)continue;comps.push({a,cx:sx/a,cy:sy/a,bw,bh})}
 if(comps.length<4)return null;const amax=Math.max(...comps.map(c=>c.a));const big=comps.filter(c=>c.a>=amax*.45);
 const cs=[[0,0],[w,0],[0,h],[w,h]];const pick=cs.map(([qx,qy])=>{let best=null,bd=1e18;big.forEach(c=>{if((c.cx<w/2)!==(qx===0)||(c.cy<h/2)!==(qy===0))return;const dd=(c.cx-qx)**2+(c.cy-qy)**2;if(dd<bd){bd=dd;best=c}});return best});
 return pick.every(Boolean)?pick:null}
async function omrRead(file,qs){const im=await omrLoadImg(file);const bin=omrBinary(im.cx,im.w,im.h);const mk=omrMarkers(bin,im.w,im.h);
 if(!mk)throw new Error('markers');
 const H=omrHomography(OMRMK,mk.map(c=>[c.cx,c.cy]));const G=omrGeom(qs,!!(cur&&cur.ws&&cur.ws.mock));const s=Math.hypot(mk[1].cx-mk[0].cx,mk[1].cy-mk[0].cy)/(OMRMK[1][0]-OMRMK[0][0]);
 const rr=Math.max(2,G.d*.36*s),fills=qs.map(()=>[]);
 G.b.forEach(p=>{const [u,v]=omrMap(H,p.x,p.y);let t=0,dk=0;const R=Math.ceil(rr);for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++){if(x*x+y*y>rr*rr)continue;const px=Math.round(u+x),py=Math.round(v+y);if(px<0||py<0||px>=im.w||py>=im.h)continue;t++;dk+=bin[py*im.w+px]}
  fills[p.q][p.o]=t?dk/t:0;p.u=u;p.v=v});
 const res=qs.map((q,i)=>{const f=fills[i];if(!f.length)return {skip:true,f:[]};const mx=Math.max(...f);const marked=f.map((x,k)=>x>=.32&&x>=mx*.55?k:-1).filter(k=>k>=0);const multi=isMulti(q);
  return {f,marked,flag:!marked.length?'none':(!multi&&marked.length>1?'multi':'')}});
 const fillAt=(x,y,r)=>{const [u,v]=omrMap(H,x,y);let t=0,dk=0;const R=Math.ceil(r);for(let yy=-R;yy<=R;yy++)for(let xx=-R;xx<=R;xx++){if(xx*xx+yy*yy>r*r)continue;const px=Math.round(u+xx),py=Math.round(v+yy);if(px<0||py<0||px>=im.w||py>=im.h)continue;t++;dk+=bin[py*im.w+px]}return {f:t?dk/t:0,u,v}};
 const info={};G.info.forEach(g=>{const rr2=Math.max(1.6,g.d*.36*s);const f=g.pts.map(p=>{const o=fillAt(p.x,p.y,rr2);p.u=o.u;p.v=o.v;return o.f});const mx=Math.max(...f);const on=f.map((x,r)=>x>=.32&&x>=mx*.6?r:-1).filter(r=>r>=0);const ch=on.length===0?'-':on.length>1?'?':g.lab[on[0]];(info[g.grp]=info[g.grp]||[]).push(ch);g.on=on});
 return {res,G,H,im,mk,s,rr,info}}
function omrOverlay(R){const cv=document.createElement('canvas');const im=R.im;cv.width=im.w;cv.height=im.h;const cx=cv.getContext('2d');cx.drawImage(im.cv,0,0);cx.lineWidth=Math.max(2,R.rr*.35);
 R.mk.forEach(c=>{cx.strokeStyle='#2f7fd0';cx.strokeRect(c.cx-c.bw/2-3,c.cy-c.bh/2-3,c.bw+6,c.bh+6)});
 R.G.info.forEach(g=>g.pts.forEach(p=>{if(g.on&&g.on.includes(p.r)){cx.beginPath();cx.arc(p.u,p.v,R.rr*.8,0,7);cx.strokeStyle='#7048e8';cx.fillStyle='#7048e855';cx.fill();cx.stroke()}}));
 R.G.b.forEach(p=>{const r=R.res[p.q];if(!r||r.skip)return;const on=r.marked.includes(p.o);cx.beginPath();cx.arc(p.u,p.v,R.rr*(on?1.25:.5),0,7);cx.strokeStyle=on?(r.flag?'#e8590c':'#2b9a5b'):'#9aa7b6';cx.fillStyle=on?(r.flag?'#e8590c55':'#2b9a5b55'):'transparent';if(on)cx.fill();cx.stroke()});return cv}

 ${(STUD&&!STUD.preview)||(sess&&!STUD)?pkSection():''}

 <h3>단축키</h3><div class="keys">${KEYS.map(k=>`<div><kbd>${k[0]}</kbd><span>${k[1]}</span></div>`).join('')}</div>

function palFill(v){v=v.trim().toLowerCase();const items=[];
 const tabs=STUD?[['home','홈'],['tasks','과제'],['enter','채점'],['wrong','오답노트'],['smap','학습지 만들기'],['shist','기록']]:[['grade','채점'],['weak','취약 유형'],['build','학습지 만들기'],['ws','내 학습지'],['books','교재'],['wrong','오답노트'],['stu','학생'],['stat','누적 분석'],...(ft('rec')?[['rec','학습 현황']]:[]),['search','문항 검색']];
