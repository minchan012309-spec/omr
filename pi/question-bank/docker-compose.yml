name: solvi-bank
services:
  backup-api:
    build: ./backup-api
    restart: unless-stopped
    environment:
      PORT: 3000
      BACKUP_ROOT: /backups
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://solvi.win,https://solvi.p-e.kr}
    volumes:
      - ${BACKUP_ROOT}:/backups
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backup-api]
    ports:
      - "127.0.0.1:${HOST_PORT:-8010}:80"
    volumes:
      - ${QUESTION_BANK_ROOT}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
